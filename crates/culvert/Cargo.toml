[package]
name = "culvert"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "High-performance, transparent TCP tunneling tool designed for standardized and compliant servers"
readme = "../../README.md"

[dependencies]
# Async Runtime & Utilities
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
futures-core = "0.3"
futures-sink = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
reusable-future = "1.0"
bytes = "1"

# Concurrency & Collections
parking_lot = "0.13"
dashmap = "6"
socket2 = "0.6"
subtle = "2"

# Configuration
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
rmp-serde = "1.3"
url = "2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }

# Logging & Error Handling
tracing = "0.1"
thiserror = "2"

# Synchronization & Utilities
scopeguard = "1.2"

# TLS
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pemfile = "2"
webpki-roots = "1.0"

# WebSocket (SIMD) & HTTP
fastwebsockets = { version = "0.10", features = ["upgrade", "unstable-split"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client", "server", "http1"] }

# HTTP/3 (QUIC)
quinn = "0.11"
h3 = "0.0.8"
h3-quinn = "0.0.10"
rcgen = "0.14"
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "tls-ring", "https-ring", "webpki-roots", "system-config"] }

[target.'cfg(windows)'.dependencies]
uds_windows = "1"
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.8", features = ["async_tokio"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[[bench]]
name = "tunnel_benchmark"
harness = false
