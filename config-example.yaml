# ==============================================================================
# Culvert Configuration Example
# Validate with:
#   culvert --check -c config-example.yaml
# ==============================================================================

log:
  level: "info"         # trace | debug | info | warn | error (Note: RUST_LOG env var overrides this if set)
  output: "stdout"
  no_color: false

# Worker threads (default: auto-detected CPU cores; 1 for single-thread runtime)
worker_threads: 4

# Global default DNS resolver settings
dns:
  strategy: "prefer_ipv4"
  resolvers:
    - type: "https"
      server: "1.1.1.1"
      tls:
        server_name: "cloudflare-dns.com"
    - type: "tls"
      server: "8.8.8.8"
      tls:
        server_name: "dns.google"
    - type: "udp"
      server: "1.1.1.1:53"
    - type: "system"

# Global default dialer settings
dialer:
  connect_timeout: "10s"
  tcp_nodelay: true
  heartbeat_interval: "15s"  # Optional: probe interval when quiet; any RX or real TX suppresses probes (default: 15s)
  idle_timeout: "30s"        # Optional: deadline with no RX and no TX activity; probe PINGs do not count (default: 30s)
  udp_idle_timeout: "30s"    # Optional: idle expiration timeout for UDP NAT flows (default: 30s)

# Global default TLS settings
tls:
  insecure: false
  # alpn: ["h3", "http/1.1"]  # Optional: custom ALPN negotiation identifiers

# Server Ingress configuration (can coexist with tunnels in same config!)
server:
  # Supported schemes: ws, wss, https, h3, quic, ws+unix, wss+unix
  # Server listen and client endpoint use the exact same URL format.
  listen:
    - "ws+unix:///run/tunnel.sock?path=/tunnel&chmod=0o660"
    - "wss+unix:///run/tunnel2.sock?path=/tunnel"
    - "wss://0.0.0.0:8443/tunnel"
    - "h3://0.0.0.0:8443/tunnel"
    - "ws://127.0.0.1:8080/tunnel"
  token: "SECURE_PRESHARED_TOKEN"   # Optional: omit or null for no-auth mode (empty string "" is rejected)
  default_target: "127.0.0.1:5201"  # Optional: fallback target
  # heartbeat_interval: "15s"       # Optional: transport heartbeat interval (default: 15s)
  # idle_timeout: "30s"             # Optional: reverse control & transport idle timeout (default: 30s)
  # udp_idle_timeout: "30s"         # Optional: server-side idle timeout for UDP NAT flows (default: 30s)
  # TLS certificate & private key (Optional: wss/h3/quic auto-generate self-signed cert if omitted)
  # certificate: "/path/to/server.crt"
  # key: "/path/to/server.key"

# Concurrent multi-tunnel definitions (single endpoint can carry multiple port mappings)
tunnels:
  # Tunnel 1: Cluster with multiple port mappings sharing one 0-RTT connection pool
  - tag: "corp-cluster"
    endpoint: "ws://127.0.0.1:8080/tunnel"
    token: "SECURE_PRESHARED_TOKEN"
    pool_size: 8
    retry:
      delay: "3s"
      max_retries: 10
    mappings:
      # Forward TCP mapping (protocol defaults to "tcp"): local 15201 -> remote 5201 (iperf3)
      - mode: "forward"
        protocol: "tcp"             # Optional: "tcp" (default) or "udp"
        listen: "127.0.0.1:15201"
        target: "127.0.0.1:5201"
      # Forward TCP mapping: local 13306 -> remote 3306 (MySQL)
      - mode: "forward"
        listen: "127.0.0.1:13306"
        target: "10.0.0.5:3306"
      # Forward TCP mapping to Unix domain socket: local 18000 -> remote unix socket
      # TCP mappings support 3 formats: ip:port, hostname:port, unix://path (UDP rejects unix://)
      - mode: "forward"
        listen: "127.0.0.1:18000"
        target: "unix:///var/run/docker.sock"
      # Forward UDP mapping: local 15353/udp -> remote 1.1.1.1:53/udp (TCP and UDP may share a port)
      - mode: "forward"
        protocol: "udp"
        listen: "127.0.0.1:15353"
        target: "1.1.1.1:53"
        udp_idle_timeout: "15s"     # Optional: per-mapping override for UDP NAT session expiry
      # Reverse TCP mapping: remote 2222 -> local 22 (SSH)
      - mode: "reverse"
        listen: "0.0.0.0:2222"
        target: "127.0.0.1:22"
      # Reverse UDP mapping: remote 51820/udp -> local 51820/udp (WireGuard)
      - mode: "reverse"
        protocol: "udp"
        listen: "0.0.0.0:51820"
        target: "127.0.0.1:51820"
        udp_idle_timeout: "60s"

  # Tunnel 2: Multi-port tunnel with HTTP/3 & custom HTTP headers
  - tag: "cloud-h3-forward"
    endpoint: "https://tunnel.example.com/tunnel"
    token: "SECURE_PRESHARED_TOKEN"
    # Custom HTTP headers sent during handshake (e.g. override Host for reverse proxies, custom routing, or auth)
    http_headers:
      Host: "vhost.example.com"
      User-Agent: "culvert/1.0"
      # X-Custom-Auth: "secret"
    mappings:
      - mode: "forward"
        listen: "127.0.0.1:18080"
        target: "10.0.0.8:8080"
