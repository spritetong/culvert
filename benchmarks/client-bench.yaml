# ==============================================================================
# Culvert Benchmark Client Configuration
# Optimized for high-concurrency throughput and stream multiplexing tests
# ==============================================================================

log:
  level: "warn" # Minimize logging overhead during stress tests
  output: "stdout"
  no_color: true

worker_threads: 4

dns:
  strategy: "prefer_ipv4"
  resolvers:
    - "system://0.0.0.0"

dialer:
  connect_timeout: "3s"
  tcp_nodelay: true

tls:
  insecure: true # Accept self-signed certificates during benchmarks
  # alpn: ["h3", "http/1.1"] # Omit to allow h3/quic/wss to auto-select proper ALPN negotiation

tunnels:
  # ----------------------------------------------------------------------------
  # Forward Tunnel Benchmark:
  # Local traffic to 127.0.0.1:15201 is tunneled to remote target 127.0.0.1:5201
  # ----------------------------------------------------------------------------
  - tag: "bench-forward-tunnel"
    token: "bench_secret_token_123456"
    mappings:
      - mode: "forward"
        listen: "127.0.0.1:15201"
        target: "127.0.0.1:5201"

    # Replace with server IP / domain:
    #   - "ws://127.0.0.1:8080/tunnel"
    #   - "wss://127.0.0.1:8443/tunnel"
    #   - "h3://127.0.0.1:8443/tunnel"
    #   - "quic://127.0.0.1:8443/raw"
    #endpoint: "wss+unix://./culvert.sock?path=/tunnel"
    #ndpoint: "wss+unix:///run/culvert.sock?path=/tunnel"
    endpoint: "quic://127.0.0.1:8443"

    # Pre-warmed connection pool for 0-RTT tunnel acquisition
    pool_size: 16
