# ==============================================================================
# Micro-Tunnel Benchmark Server Configuration
# Optimized for maximum throughput and low latency stress-testing
# ==============================================================================

log:
  level: "warn" # Use 'warn' during stress tests to avoid console I/O bottlenecks
  output: "stdout"
  no_color: true

# Set according to available CPU cores (e.g. 4, 8, or omit for auto-detection)
worker_threads: 4

server:
  # Ingress listener. Supports:
  #   - ws://0.0.0.0:8080
  #   - wss://0.0.0.0:8443
  #   - h3://0.0.0.0:8443 (HTTP/3 over QUIC)
  #   - quic://0.0.0.0:8443 (Raw QUIC)
  listen:
    - "wss://0.0.0.0:8443/tunnel"
    - "h3://0.0.0.0:8443/tunnel"
    - "quic://0.0.0.0:8444"
  #token: "bench_secret_token_123456"
  # Default backend target (e.g. iperf3 server, nginx, or echo service)
  default_target: "127.0.0.1:5201"
