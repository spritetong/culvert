# ==============================================================================
# Culvert Docker Compose Example
#
# Usage:
#   1. Copy this file as docker-compose.yml
#   2. Place your config.yaml in the same directory (or update volume mount)
#   3. Run: docker compose up -d
# ==============================================================================

services:
  culvert:
    image: ghcr.io/spritetong/culvert:latest
    container_name: culvert
    restart: unless-stopped

    # Host networking is recommended for high-performance network proxies and tunnels,
    # as it minimizes NAT overhead and eliminates Docker bridge latency.
    network_mode: host

    # Alternatively, if using bridge network mode:
    # ports:
    #   - "8080:8080/tcp"
    #   - "8443:8443/udp"

    volumes:
      # Mount your configuration file into the container (read-only)
      - ./config.yaml:/etc/culvert/config.yaml:ro
      # Optional: synchronize host timezone (supported via pre-created files & tzdata)
      # - /etc/localtime:/etc/localtime:ro
      # - /etc/timezone:/etc/timezone:ro
      # If using custom TLS certificates, mount them into /etc/culvert/certs:
      # - ./certs:/etc/culvert/certs:ro

    environment:
      # Optional: override logging level (trace, debug, info, warn, error)
      - RUST_LOG=info
      # Optional: configure container timezone (e.g. Asia/Shanghai, America/New_York)
      # - TZ=UTC

    # Security enhancements
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
