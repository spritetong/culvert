[workspace]
members = ["crates/culvert", "crates/culvert-cli"]
default-members = ["crates/culvert", "crates/culvert-cli"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["Sprite Tong <spritetong@gmail.com>"]
repository = "https://github.com/spritetong/culvert"
license = "MPL-2.0"

[profile.release]
lto = "fat"
panic = "abort"
codegen-units = 1
opt-level = 3
debug = 0
strip = true
