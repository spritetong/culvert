[package]
name = "micro-tunnel"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "micro-tunnel"
path = "src/main.rs"

[profile.release]
lto = "fat"
panic = "abort"
codegen-units = 1
opt-level = 3
debug = 0
strip = true

[dependencies]
# Async Runtime & Utilities
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
futures-core = "0.3"
futures-sink = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
bytes = "1"

# Concurrency & Collections
parking_lot = "0.13"
dashmap = "6"
socket2 = "0.6"
mimalloc = { version = "0.1", default-features = false }
subtle = "2"

# Configuration & CLI
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0.221", features = ["derive"] }
serde_yaml = "0.9"
rmp-serde = "1.3"
url = "2"

# Logging & Error Handling
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"

# TLS
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pemfile = "2"
webpki-roots = "1.0"

# WebSocket (SIMD) & HTTP
fastwebsockets = { version = "0.10", features = ["upgrade", "unstable-split"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client", "server", "http1"] }

# HTTP/3 (QUIC)
quinn = "0.11"
h3 = "0.0.8"
h3-quinn = "0.0.10"
rcgen = "0.14"
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio", "tls-ring", "https-ring", "webpki-roots", "system-config"] }

[dev-dependencies]
criterion = { version = "0.8", features = ["async_tokio"] }

[[bench]]
name = "tunnel_benchmark"
harness = false
